<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان ابری (مقاوم در برابر نت ملی)</title>
    <!-- استفاده از Tailwind CSS برای طراحی سریع و زیبا -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between">

    <!-- هدر -->
    <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center border-b border-slate-700">
        <h1 class="font-bold text-lg text-emerald-400">💬 پیام‌رسان امن (منطقه مقاوم)</h1>
        <span id="status" class="text-xs bg-amber-500/10 text-amber-400 px-2 py-1 rounded-full border border-amber-500/20">در حال اتصال...</span>
    </header>

    <!-- لیست پیام‌ها -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
        <!-- پیام‌ها اینجا لود می‌شوند -->
    </main>

    <!-- فرم ارسال پیام -->
    <footer class="bg-slate-800 p-3 border-t border-slate-700">
        <form id="chat-form" class="flex gap-2 max-w-4xl mx-auto">
            <input type="text" id="username" placeholder="نام شما" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm w-32 focus:outline-none focus:border-emerald-500" required>
            <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500" required>
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors">ارسال</button>
        </form>
    </footer>

    <script>
        // تنظیمات Supabase (کلیدهای پروژه خود را اینجا وارد کنید)
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co'; // یا آدرس Cloudflare Worker پروکسی شده
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const usernameInput = document.getElementById('username');
        const statusBadge = document.getElementById('status');

        // بارگذاری پیام‌های قبلی
        async function fetchMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) {
                console.error('خطا در دریافت پیام‌ها:', error);
                statusBadge.textContent = 'خطا در اتصال';
                statusBadge.className = 'text-xs bg-rose-500/10 text-rose-400 px-2 py-1 rounded-full border border-rose-500/20';
                return;
            }

            statusBadge.textContent = 'متصل (آنلاین)';
            statusBadge.className = 'text-xs bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-full border border-emerald-500/20';
            
            chatBox.innerHTML = '';
            data.forEach(msg => appendMessage(msg));
            scrollToBottom();
        }

        // اضافه کردن پیام به صفحه
        function appendMessage(msg) {
            const isMe = msg.user_id === usernameInput.value;
            const div = document.createElement('div');
            div.className = `flex flex-col max-w-[75%] ${isMe ? 'self-end items-end' : 'self-start items-start'} mb-2`;
            
            div.innerHTML = `
                <span class="text-[10px] text-slate-400 mb-1 px-1">${escapeHtml(msg.user_id)}</span>
                <div class="p-3 rounded-xl text-sm ${isMe ? 'bg-emerald-600 text-white rounded-bl-xl' : 'bg-slate-700 text-slate-200 rounded-br-xl'} shadow">
                    ${escapeHtml(msg.content)}
                </div>
            `;
            chatBox.appendChild(div);
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // ارسال پیام
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = messageInput.value.trim();
            const user_id = usernameInput.value.trim();
            if (!content || !user_id) return;

            messageInput.value = '';
            
            const { error } = await supabase
                .from('messages')
                .insert([{ user_id, content }]);

            if (error) alert('خطا در ارسال پیام: ' + error.message);
        });

        // گوش دادن به پیام‌های جدید به صورت Realtime
        supabase.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessage(payload.new);
                scrollToBottom();
            })
            .subscribe();

        // اجرای اولیه
        fetchMessages();
    </script>
</body>
</html>
